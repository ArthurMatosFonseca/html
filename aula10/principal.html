<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafeteria Grão Dourado</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <main>
    <h1>☕ Cardápio</h1>
    <div class="card">
      <h4>Espresso</h4>
      <p>Café curto e intenso.</p>
      <span class="preco">R$ 6,00</span>
      <button type="button" class="botao">Pedir</button>
    </div>
    <div class="card">
      <h4>Cappuccino</h4>
      <p>Café, leite vaporizado e canela.</p>
      <span class="preco">R$ 9,50</span>
      <button type="button" class="botao">Pedir</button>
    </div>
    <div class="card">
      <h4>Bolo de cenoura</h4>
      <p>Volta amanhã!</p>
      <span class="preco">R$ 7,00</span>
      <button type="button" class="botao" disabled>Esgotado</button>
    </div>
    <form class="contato">
      <h2>Receba nossas promoções</h2>
      <label for="email">Seu e-mail</label>
      <input type="email" id="email" class="campo" placeholder="voce@email.com">
      <button type="submit" class="botao">Quero receber</button>
      
    </form>
  </main>
</body>
</html>
